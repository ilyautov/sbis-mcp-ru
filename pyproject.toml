[project]
name = "sbis-mcp-ru"
version = "0.2.1"
description = "API СБИС (Saby) для ИИ-ассистентов: документы и этапы документооборота, подписание вложений, сертификаты и МЧД, сотрудники, контрагенты, подразделения"
keywords = ["mcp", "model-context-protocol", "sbis", "saby", "сбис", "edi", "эдо", "russia", "claude"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ilya Utov" }]
dependencies = [
    # Ядро живёт отдельным пакетом: пять серверов делят его, а не копируют.
    "schema-mcp-core>=0.2.0,<1",
]

[project.urls]
Homepage = "https://business-mcp-ru.aifrontier.tech/"
Documentation = "https://business-mcp-ru.aifrontier.tech/sbis-api.html"
Repository = "https://github.com/ilyautov/sbis-mcp-ru"
Issues = "https://github.com/ilyautov/sbis-mcp-ru/issues"
Changelog = "https://github.com/ilyautov/sbis-mcp-ru/blob/main/CHANGELOG.md"

[project.scripts]
sbis-mcp-ru = "sbis_mcp.server:cli"
sbis-mcp = "sbis_mcp.server:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sbis_mcp"]

[tool.setuptools.package-data]
sbis_mcp = ["endpoints.yaml", "entities.yaml"]
