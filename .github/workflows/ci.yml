name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: python -m pytest tests/ -q
      - name: Сервер поднимается и отдаёт инструменты
        run: |
          python - <<'PY'
          import asyncio

          from sbis_mcp.server import mcp

          tools = asyncio.run(mcp.list_tools())
          assert tools, "сервер поднялся, но инструментов нет"
          print("sbis-mcp-ru:", len(tools), "инструментов")
          PY
